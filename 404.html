<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Reva Calibration</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      background: #07090E;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .error-card {
      max-width: 540px;
      padding: 48px 36px;
      background: rgba(14, 20, 30, 0.9);
      border: 1px solid rgba(255, 107, 0, 0.25);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #FF6B00;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 1.5rem;
      margin: 0 0 12px 0;
      color: #FFFFFF;
      font-weight: 700;
    }
    .error-desc {
      color: #94A3B8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: #FF6B00;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: #E05D00;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Calibration Standard Not Found</h1>
    <p class="error-desc">The page or asset you are looking for does not exist or has been relocated within the laboratory facility.</p>
    <a href="/" class="btn-home">&larr; Return to Homepage</a>
  </div>
</body>
</html>
